name: Build stable-diffusion.cpp packages

on:
  schedule:
    # Deliberately far from the sibling builders, which dispatch into the same
    # APT repository. whisper-cpp-deb runs Sunday 03:00 UTC and llama-cpp-deb
    # Sunday 21:00 UTC. Two builders dispatching close together fail the second
    # Pages deployment in li-ruijie/apt, after its packages are already built.
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag override, for example master-829-0a565f2."
        required: false
        type: string
      force:
        description: "Rebuild even when the deployed version already matches"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

# Set workflow-wide rather than on the one job that needs it. A container job
# defaults to sh, which is dash here, where mapfile, process substitution, and
# ${var//a/b} are all syntax errors. That failed the cuda job after a
# half-hour compile had already succeeded, at a step that reads one filename.
defaults:
  run:
    shell: bash

env:
  UPSTREAM: leejet/stable-diffusion.cpp

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve the upstream tag and decide whether to build
        id: resolve
        env:
          TAG_OVERRIDE: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          if [ -n "$TAG_OVERRIDE" ]; then
            TAG="$TAG_OVERRIDE"
          else
            # Deliberately not releases/latest. Upstream cuts one release per
            # push to master and two runs can finish out of order, so the API
            # marks the older commit as latest. Observed on 2026-08-25, where
            # master-830-50d6405 was published at 18:57:24 and
            # master-829-0a565f2 at 18:59:09, and 829 was reported as latest
            # while both carried the full nine assets. Taking latest would pin
            # this repository to 0.0.829 and then never advance, since every
            # later run would find the deployed version already matching.
            TAG=$(gh api "repos/$UPSTREAM/releases?per_page=100" --jq '
              [ .[]
                | select(.tag_name | test("^master-[0-9]+-[0-9a-f]+$"))
                | { tag: .tag_name,
                    count: (.tag_name | split("-")[1] | tonumber) } ]
              | sort_by(.count) | last | .tag')
          fi

          case "$TAG" in
            master-*-*) ;;
            *) echo "::error::$TAG is not a master-<count>-<sha> tag"; exit 1 ;;
          esac

          COUNT=$(printf '%s' "$TAG" | cut -d- -f2)
          SHA=${TAG##*-}

          case "$COUNT" in
            ''|*[!0-9]*) echo "::error::no commit count in $TAG"; exit 1 ;;
          esac

          # Upstream publishes no semantic tag of any kind, so the commit count
          # is the version. It comes from git rev-list --count HEAD in
          # upstream's release job, so it is monotonic and 0.0.829 upgrades to
          # 0.0.830 as apt expects.
          VERSION="0.0.${COUNT}"

          # Upstream's release assets are no longer read. Its Linux archives
          # moved to Ubuntu 26.04 and require GLIBC_2.43, beyond Debian
          # trixie, so the build job compiles the same tag from source. The
          # release only marks which commits upstream considers built.
          echo "Upstream $TAG, commit $SHA, version $VERSION"
          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          # The range must anchor on ^Package: sd-cpp$, since sd-cpp-cuda and
          # sd-cpp-vulkan both begin with that string and an unanchored match
          # would read the wrong stanza.
          DEPLOYED=$(curl -fsSL \
            https://li-ruijie.github.io/apt/dists/stable/dynamic/binary-amd64/Packages \
            2>/dev/null \
            | awk '/^Package: sd-cpp$/,/^$/' \
            | grep '^Version:' | awk '{print $2}' || true)

          if [ "$VERSION" = "$DEPLOYED" ] && [ "$FORCE" != "true" ]; then
            echo "Version $VERSION already deployed, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$VERSION" = "$DEPLOYED" ]; then
            echo "Rebuilding $VERSION (forced)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION (deployed: ${DEPLOYED:-none})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs alongside the build jobs rather than gating them, and publish waits on
  # the result. These suites were local-only in whisper-cpp-deb at first, which
  # is how a missing mkdir reached CI rather than being caught on the desk.
  test:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install what the suites need
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Assert every script is executable in git
        run: |
          # This filesystem is not the one that matters. Windows checkouts
          # report every file as executable, so a script committed at 100644
          # runs locally and fails on the runner with exit 126, "Permission
          # denied". That happened twice before this check existed.
          bad=$(git ls-files -s scripts/ | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::these scripts are not mode 100755 in git"
            printf '  %s\n' $bad
            echo "Fix with: git update-index --chmod=+x <path>"
            exit 1
          fi
          echo "all $(git ls-files scripts/ | wc -l) scripts are 100755"

      - name: Run every suite
        run: |
          status=0
          for t in scripts/test/test-*.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Compiles what sd-cpp and sd-cpp-vulkan ship, in place of downloading
  # upstream's Linux archives. Upstream builds those on ubuntu-latest, which
  # moved to Ubuntu 26.04 in October 2026, and from master-1050 they require
  # GLIBC_2.43 through sqrtf and atan2f. Debian trixie carries 2.41. Ubuntu
  # 24.04 reproduces the GLIBC_2.38 and GLIBCXX_3.4.32 floor every package
  # since 0.0.830 has declared, and matches the CUDA container below.
  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install build dependencies
        run: |
          # Before checkout, which needs git present or it falls back to a REST
          # download. libvulkan-dev, glslc, and spirv-headers are what
          # upstream's own Linux Vulkan job installs. binutils supplies readelf
          # for the floor and linkage checks.
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates cmake zip unzip xz-utils \
            binutils libvulkan-dev glslc spirv-headers

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # The versions upstream's own Linux jobs pin. Without pnpm on PATH,
      # upstream's CMake builds sd-server with no web interface and says so only
      # in a warning, which the step after the compile turns into a failure.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v6.1.0
        with:
          version: 10.15.1

      - name: Check out upstream at the resolved tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # The exact tag, so upstream's CMake reads the real commit through git
          # rev-parse and the smoke test can assert it. Only the four submodules
          # this build compiles. CUTLASS is large and only the CUDA job uses it.
          git clone --depth 1 --branch "$TAG" \
            https://github.com/leejet/stable-diffusion.cpp.git upstream
          git -C upstream submodule update --init --depth 1 \
            ggml examples/server/frontend thirdparty/libwebp thirdparty/libwebm

      - name: Compile
        working-directory: upstream
        run: |
          # Upstream's Linux Vulkan configure line, unchanged. Its CMakeLists
          # defaults the build type to Release.
          cmake -B build \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_VULKAN=ON \
            -DGGML_NATIVE=OFF \
            -DSD_BUILD_SHARED_GGML_LIB=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' 2>&1 | tee ../configure.log
          cmake --build build -j"$(nproc)"

      - name: Assert the web interface was embedded
        run: |
          # Upstream's CMake treats a missing pnpm as a warning and builds
          # sd-server without its interface, so a green compile proves nothing.
          fail() { echo "::error::$*"; exit 1; }
          grep -F 'pnpm found:' configure.log || fail "CMake did not find pnpm"
          if grep -F 'frontend build disabled' configure.log; then
            fail "CMake disabled the frontend build"
          fi
          header=upstream/examples/server/frontend/dist/gen_index_html.h
          [ -s "$header" ] || fail "no generated interface header at $header"
          echo "web interface embedded, header $(stat -c %s "$header") bytes"

      - name: List the objects
        id: objects
        run: |
          # Real files only. CMake lays the versioned libraries out as symlink
          # chains, and each target is measured once.
          objects=$(find upstream/build/bin -maxdepth 1 -type f \
            -exec sh -c 'readelf -h "$1" >/dev/null 2>&1' _ {} \; -print | sort)
          printf '%s\n' "$objects"
          printf 'objects<<END\n%s\nEND\n' "$objects" >> "$GITHUB_OUTPUT"

      - name: Assert the ABI floor has not risen
        env:
          OBJECTS: ${{ steps.objects.outputs.objects }}
        run: |
          # Every object, since on 2026-11-08 the floor rose in the libraries
          # while sd-cli stayed put. 2.38 already excludes bookworm, and a move
          # to 2.42 would exclude trixie, which is the whole supported target.
          mapfile -t objs <<< "$OBJECTS"
          bash scripts/check-abi-floor.sh 2.38 3.4.32 "${objs[@]}"

      - name: Assert the declared runtime dependencies match the linkage
        env:
          OBJECTS: ${{ steps.objects.outputs.objects }}
        run: |
          # Depends is derived from measurement, so it has to be rechecked
          # against measurement or it silently goes stale. Everything the
          # payload links beyond the bundled objects and the C and C++ runtimes
          # must be covered by a Depends entry, and libgomp1 is the only one.
          needed=$(while read -r f; do
                     # Ships in sd-cpp-vulkan, which declares libvulkan1.
                     [ "${f##*/}" = libggml-vulkan.so ] && continue
                     readelf -d "$f" 2>/dev/null \
                       | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'
                   done <<< "$OBJECTS" | sort -u)
          printf '%s\n' "$needed" | sed 's/^/  /'

          known='^(libstable-diffusion|libggml|libggml-base|libwebp|libwebpmux'
          known="$known"'|libwebm|libsharpyuv|libc|libm|libdl|libpthread|librt'
          known="$known"'|libstdc\+\+|libgcc_s|ld-linux-x86-64|libgomp)\.so'

          unexpected=$(printf '%s\n' "$needed" | grep -vE "$known" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::the payload links libraries no Depends entry covers"
            printf '%s\n' "$unexpected"
            echo "Add the providing package to Depends in package-base.sh, then"
            echo "add the soname to the known list here."
            exit 1
          fi

          printf '%s\n' "$needed" | grep -q '^libgomp\.so' || {
            echo "::error::libgomp is no longer linked, so Depends is stale"
            exit 1; }
          echo "every linked library is covered by Depends"

      - name: Pack the archive
        run: |
          # Upstream's own pack step, so package-base.sh and package-vulkan.sh
          # receive the layout they were written against. zip follows the
          # symlinks and stores each as a copy, as upstream's archive does,
          # and package-base.sh collapses those copies again. The launcher
          # scripts upstream adds are left out, since they suit an unpacked
          # folder and not /usr/lib/sd-cpp.
          cp upstream/ggml/LICENSE upstream/build/bin/ggml.txt
          cp upstream/LICENSE upstream/build/bin/stable-diffusion.cpp.txt
          zip -qj archive.zip upstream/build/bin/*
          unzip -l archive.zip

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: archive
          path: archive.zip
          if-no-files-found: error

  # On Debian trixie itself, since the smoke test runs the binaries against the
  # host's glibc. On ubuntu-latest, which became 26.04, binaries requiring
  # GLIBC_2.43 loaded and passed, so the host proved nothing about the target.
  base:
    needs: [check, build]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install what packaging and the smoke test need
        run: |
          # readelf for the smoke test. dpkg-deb, cmp, and ldd are already in
          # the image.
          apt-get update
          apt-get install -y --no-install-recommends binutils unzip

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: archive

      - name: Build sd-cpp
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: bash scripts/package-base.sh archive.zip "$VERSION" dist

      - name: Install the package with apt
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Through apt rather than dpkg, so trixie's own archive resolves the
          # declared Depends, which proves trixie can satisfy them. It also
          # supplies what the smoke test loads, such as libgomp1, which this
          # image lacks. The ubuntu-latest host carried libgomp1 already, so the
          # smoke test once passed there without Depends being installed.
          apt-get install -y --no-install-recommends "./dist/sd-cpp_${VERSION}_amd64.deb"

      - name: Smoke test
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXPECT_COMMIT: ${{ needs.check.outputs.sha }}
        run: bash scripts/smoke-test.sh "dist/sd-cpp_${VERSION}_amd64.deb"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: base
          path: dist/*.deb
          if-no-files-found: error

  vulkan:
    needs: [check, build]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install a Vulkan loader, a software device, and the tools
        run: |
          # With no loader present ggml ignores the backend in silence, so this
          # is what lets the smoke test assert anything at all. It also makes
          # REQUIRE_FULL_LINKAGE satisfiable below. readelf comes from binutils.
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils unzip libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: archive

      - name: Build sd-cpp and sd-cpp-vulkan
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The base is rebuilt here rather than pulled from the base job, since
          # the smoke test needs both packages and an artifact round trip costs
          # more than an unzip.
          bash scripts/package-base.sh   archive.zip "$VERSION" dist
          bash scripts/package-vulkan.sh archive.zip "$VERSION" dist

      - name: Check the backend links nothing undeclared
        run: |
          mkdir -p probe && dpkg-deb -x dist/sd-cpp-vulkan_*.deb probe
          bash scripts/check-backend-deps.sh \
            probe/usr/lib/sd-cpp/libggml-vulkan.so vulkan

      - name: Assert the backend declares the base library
        run: |
          # The unit suite cannot cover this, since no stand-in object it can
          # build carries the entry. Asserted here against the real backend.
          readelf -d probe/usr/lib/sd-cpp/libggml-vulkan.so \
            | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' \
            | grep -q '^libggml-base\.so' || {
              echo "::error::the Vulkan backend does not declare libggml-base"
              echo "It cannot be a ggml backend for the base package if it does"
              echo "not link the base library."
              exit 1; }
          echo "the backend declares libggml-base"

      - name: Record what the software rasteriser offers
        run: |
          # Kept for the record rather than to decide anything. An earlier
          # version of this job gated the device assertion on
          # storageBuffer16BitAccess, following the measurement in
          # whisper-cpp-deb that Ubuntu 22.04's llvmpipe lacks it. On 24.04
          # lavapipe advertised it and ggml still reported "No devices found",
          # so that capability is necessary and not sufficient, and no property
          # read out of vulkaninfo can stand in for asking ggml itself. On
          # trixie, with Mesa 25.0.7 and LLVM 19.1.7, ggml also reports "No
          # devices found" while having loaded the backend.
          vulkaninfo --summary 2>&1 | head -40 || true

      - name: Install both packages with apt
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # As in the base job, so trixie resolves the declared Depends of both
          # and the smoke test finds what they name.
          apt-get install -y --no-install-recommends \
            "./dist/sd-cpp_${VERSION}_amd64.deb" \
            "./dist/sd-cpp-vulkan_${VERSION}_amd64.deb"

      - name: Smoke test
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXPECT_COMMIT: ${{ needs.check.outputs.sha }}
          # The loader is installed above, so every library must resolve and an
          # unjudgeable check becomes a failure rather than a silent skip.
          REQUIRE_FULL_LINKAGE: '1'
          # EXPECT_BACKEND is deliberately unset. These runners have no GPU and
          # lavapipe is rejected by ggml, so no Vulkan device can ever be
          # listed and asserting one would fail every run for an environmental
          # reason. The smoke test still asserts that ggml dlopened the
          # backend, which is the stronger half and does hold here.
        run: |
          bash scripts/smoke-test.sh \
            "dist/sd-cpp_${VERSION}_amd64.deb" \
            "dist/sd-cpp-vulkan_${VERSION}_amd64.deb"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: vulkan
          path: dist/sd-cpp-vulkan_*.deb
          if-no-files-found: error

  cuda:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      # 13.3 rather than upstream's 12.6.3, so the runtime dependency matches
      # llama-cpp-cuda and whisper-cpp-cuda and one NVIDIA apt configuration
      # serves all three. 24.04 rather than the siblings' 22.04, since the base
      # package already sits at a GLIBC_2.38 floor, so there is nothing lower
      # left to hold here.
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04
    steps:
      - name: Install build dependencies
        run: |
          # Before checkout, which needs git present or it falls back to a REST
          # download. No sudo: a container job already runs as root.
          apt-get update
          # dpkg supplies dpkg-deb. The Vulkan headers and glslc are what
          # upstream's own Linux Vulkan job installs, needed here since the
          # library is built with SD_VULKAN as well.
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates curl xz-utils \
            dpkg ccache libvulkan-dev glslc spirv-headers

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Fetch CMake 3.31.12
        run: |
          # The container ships a CMake that predates CMAKE_CUDA_ARCHITECTURES
          # accepting a 120a value. Fetched rather than trusted, since the cost
          # is small and the failure would be a build error late in a long job.
          curl -fsSL -o cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12-linux-x86_64.tar.gz
          tar xzf cmake.tar.gz
          echo "$PWD/cmake-3.31.12-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain and check the driver stubs exist
        run: |
          cmake --version | head -1
          nvcc --version | tail -2
          # The smoke test feeds this to LD_LIBRARY_PATH so libcuda.so.1
          # resolves without a real driver. With REQUIRE_FULL_LINKAGE set, a
          # wrong path here would surface as an unresolved library at the very
          # end of a long job, so it is checked before the compile instead.
          stubs=/usr/local/cuda/lib64/stubs
          if [ ! -e "$stubs/libcuda.so" ]; then
            echo "::error::no libcuda.so under $stubs"
            find /usr/local/cuda -name 'libcuda.so*' 2>/dev/null | head
            exit 1
          fi
          echo "driver stubs present at $stubs"
          ls "$stubs"

      - name: Check out upstream at the resolved tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # The exact tag, not master. The backend must be ABI-compatible with
          # the base package, which comes from this same release. Recursive,
          # since the library compiles in CUTLASS from thirdparty/cutlass, and
          # shallow throughout, since CUTLASS history is large.
          git clone --depth 1 --branch "$TAG" --recursive --shallow-submodules \
            https://github.com/leejet/stable-diffusion.cpp.git upstream

      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          # Under the workspace rather than somewhere like /ccache. The
          # workspace is bind-mounted into the container, so both the cache
          # action and the compiler see the same directory. A container-only
          # path is the most likely way for this to silently cache nothing.
          path: ${{ github.workspace }}/.ccache
          # The exact key changes on every upstream tag, so restore-keys is the
          # load-bearing half. Without the prefix fallback the cache would never
          # be reused and this would achieve nothing.
          key: ccache-cuda13.3-${{ needs.check.outputs.tag }}
          restore-keys: |
            ccache-cuda13.3-

      - name: Configure ccache
        run: |
          # ggml finds ccache on PATH by itself, so no CMake flag changes.
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
            echo "CCACHE_MAXSIZE=2G"
            # Hash the compiler rather than trust its mtime, so a container
            # image bump invalidates the cache instead of silently reusing
            # objects built by a different nvcc.
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache --zero-stats
          ccache --version | head -1

      - name: Compile the CUDA backend and library
        working-directory: upstream
        run: |
          # SD_BUILD_EXAMPLES=OFF is the deliberate departure from upstream's
          # Dockerfile.cuda. This job wants libggml-cuda.so and
          # libstable-diffusion.so, and turning the examples off also removes
          # upstream's Node and pnpm requirement, which exists solely to embed
          # the sd-server web UI. The build job compiles both executables for
          # the base package.
          #
          # From master-1037 the CUDA kernels for RoPE, INT8, and attention are
          # compiled into libstable-diffusion.so, and sd-cpp-cuda replaces the
          # base copy with this build. SD_VULKAN is on as well, so the Vulkan
          # kernels the base copy carries survive the replacement. It also
          # compiles a libggml-vulkan.so, which is discarded, since
          # sd-cpp-vulkan ships the one from the build job.
          #
          # GGML_CUDA_NCCL must stay OFF. It defaults on and this container
          # ships NCCL, so CMake would link libnccl.so.2 into the backend.
          # Target machines have no NCCL, so the backend would fail to dlopen
          # and ggml would fall back to CPU without saying why. That fault
          # reached llama-cpp-deb once already, and was found by reading a
          # passing smoke test's output rather than by any failure.
          cmake -B build \
            -DSD_CUDA=ON \
            -DSD_VULKAN=ON \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DSD_BUILD_SHARED_GGML_LIB=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_CUDA_ARCHITECTURES="89-real;120a-real;90-virtual"
          cmake --build build --config Release -j"$(nproc)"

      - name: Report the compiler cache
        run: |
          # Printed rather than merely relied upon. A cache that has quietly
          # stopped working shows up here as a hit rate near zero, where
          # otherwise it would only ever look like a slow build.
          ccache --show-stats
          printf 'cache directory holds %s\n' \
            "$(du -sh "$GITHUB_WORKSPACE/.ccache" 2>/dev/null | cut -f1)"

      - name: Locate the backend
        id: backend
        run: |
          # find rather than a fixed path, since the tree layout is upstream's
          # to change. More than one match would be ambiguous, so it is an
          # error rather than a silent first-wins.
          for pair in path:libggml-cuda.so library:libstable-diffusion.so; do
            key=${pair%%:*} name=${pair#*:}
            mapfile -t found < <(find upstream/build -name "$name" -type f)
            printf 'found %s %s:\n' "${#found[@]}" "$name"
            printf '  %s\n' "${found[@]}"
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one $name, found ${#found[@]}"
              exit 1
            fi
            echo "$key=${found[0]}" >> "$GITHUB_OUTPUT"
          done

      - name: Derive the CUDA suffix from nvcc
        id: cuda
        run: |
          # Derived rather than hardcoded, so a container bump moves the
          # declared dependency with it rather than leaving it stale.
          ver=$(nvcc --version | sed -n 's/.*release \([0-9]*\.[0-9]*\).*/\1/p')
          [ -n "$ver" ] || { echo "::error::could not read a version from nvcc"; exit 1; }
          echo "nvcc reports $ver"
          echo "suffix=${ver//./-}" >> "$GITHUB_OUTPUT"

      - name: Check the backend links nothing undeclared
        run: bash scripts/check-backend-deps.sh "${{ steps.backend.outputs.path }}" cuda

      - name: Check the library links nothing undeclared
        env:
          LIBRARY: ${{ steps.backend.outputs.library }}
        run: |
          # Printed in full first, for the record, as with every other object.
          needed=$(readelf -d "$LIBRARY" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          printf '%s\n' "$needed" | sed 's/^/  /'
          bash scripts/check-backend-deps.sh "$LIBRARY" cuda
          # The Vulkan kernels reach the loader through ggml's extension
          # service rather than by linking it, as in upstream's own Vulkan
          # build, and sd-cpp-cuda declares no libvulkan1.
          if printf '%s\n' "$needed" | grep -q '^libvulkan'; then
            echo "::error::the library links the Vulkan loader, which sd-cpp-cuda does not declare"
            exit 1
          fi
          printf '%s\n' "$needed" | grep -q '^libggml-base\.so' || {
            echo "::error::the library does not declare libggml-base"
            exit 1; }
          echo "the library links only declared objects"

      - name: Assert the backend declares the base library
        run: |
          readelf -d "${{ steps.backend.outputs.path }}" \
            | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' \
            | grep -q '^libggml-base\.so' || {
              echo "::error::the CUDA backend does not declare libggml-base"
              exit 1; }
          echo "the backend declares libggml-base"

      - name: Build sd-cpp-cuda
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SUFFIX: ${{ steps.cuda.outputs.suffix }}
        run: |
          bash scripts/package-cuda.sh \
            "${{ steps.backend.outputs.path }}" "${{ steps.backend.outputs.library }}" \
            upstream "$VERSION" "$SUFFIX" dist

      - name: Assert the ABI floor of the CUDA objects
        run: |
          # sd-cpp-cuda declares no glibc or libstdc++ floor of its own and
          # leans on the one sd-cpp declares, so its objects must not require
          # more. This container carries glibc 2.39, one above that floor.
          bash scripts/check-abi-floor.sh 2.38 3.4.32 \
            "${{ steps.backend.outputs.path }}" "${{ steps.backend.outputs.library }}"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: cuda
          path: dist/sd-cpp-cuda_*.deb
          if-no-files-found: error

  # Separate from the compile so the base package can come from the build job
  # without that job and the 40-minute compile running one after the other.
  # The same image, since it is the one carrying the driver stubs beside the
  # real libcudart and libcublas the backend links.
  cuda-test:
    needs: [check, build, cuda]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04
    steps:
      - name: Install what packaging and the tests need
        run: |
          # diffutils supplies cmp, which package-base.sh uses to prove the
          # duplicate library copies really are identical before collapsing
          # them to symlinks, and which the diversion test compares with.
          # binutils supplies readelf for the smoke test.
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils diffutils dpkg unzip

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Download the archive and the CUDA package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: '{archive,cuda}'
          merge-multiple: true

      - name: Build the base package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # From the build job's archive. This step once downloaded upstream's
          # Linux archive instead, which is how GLIBC_2.43 objects reached the
          # smoke test on 2026-11-08.
          bash scripts/package-base.sh archive.zip "$VERSION" dist
          mv "sd-cpp-cuda_${VERSION}_amd64.deb" dist/

      - name: Build a driver stub directory carrying the soname
        run: |
          # NVIDIA ships libcuda.so in its stubs directory, with no libcuda.so.1
          # beside it, and the soname is what the loader asks for. Pointing
          # LD_LIBRARY_PATH straight at the stubs therefore still leaves
          # libcuda.so.1 unresolved, which REQUIRE_FULL_LINKAGE below would
          # correctly fail on. A directory carrying the soname is assembled
          # here instead.
          mkdir -p "$GITHUB_WORKSPACE/stubs"
          cp /usr/local/cuda/lib64/stubs/libcuda.so "$GITHUB_WORKSPACE/stubs/libcuda.so.1"
          ls -l "$GITHUB_WORKSPACE/stubs"

      - name: Smoke test
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXPECT_COMMIT: ${{ needs.check.outputs.sha }}
          # Two directories, colon joined, since the smoke test appends this to
          # LD_LIBRARY_PATH verbatim. The first supplies libcuda.so.1 in place
          # of a real driver, and the second the real libcudart and libcublas
          # the backend links, so every library resolves and the
          # undefined-symbol verdict can be reached rather than skipped.
          BACKEND_STUB_DIR: ${{ github.workspace }}/stubs:/usr/local/cuda/lib64
          REQUIRE_FULL_LINKAGE: '1'
          # EXPECT_BACKEND is deliberately unset. This runner has no NVIDIA
          # hardware, so no CUDA device can ever be listed. The smoke test still
          # asserts that ggml dlopened the backend, which does hold here.
        run: |
          bash scripts/smoke-test.sh \
            "dist/sd-cpp_${VERSION}_amd64.deb" \
            "dist/sd-cpp-cuda_${VERSION}_amd64.deb"

      - name: Install and remove both packages, checking the diversion
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXPECT_COMMIT: ${{ needs.check.outputs.sha }}
        run: |
          # The maintainer scripts only run under dpkg, and this container runs
          # as root with the CUDA runtime packages installed, so the diversion
          # is exercised for real rather than read out of the scripts. Both
          # reference copies come from what ships, the base library from the
          # archive and the CUDA library from the package itself.
          set -euo pipefail
          lib=/usr/lib/sd-cpp/libstable-diffusion.so
          unzip -p archive.zip libstable-diffusion.so > base-library.so
          mkdir -p cuda-payload
          dpkg-deb -x "dist/sd-cpp-cuda_${VERSION}_amd64.deb" cuda-payload
          LIBRARY=cuda-payload$lib
          fail() { echo "::error::$*"; exit 1; }
          cmp -s "$LIBRARY" base-library.so && fail "the two reference copies are identical"

          dpkg -i "dist/sd-cpp_${VERSION}_amd64.deb" "dist/sd-cpp-cuda_${VERSION}_amd64.deb"
          dpkg-divert --list "$lib"
          [ "$(dpkg-divert --truename "$lib")" = "$lib.distrib" ] \
            || fail "the library is not diverted"
          cmp -s "$lib" "$LIBRARY" || fail "the CUDA library is not in place"
          cmp -s "$lib.distrib" base-library.so || fail "the base copy was not moved aside"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/stubs:/usr/local/cuda/lib64" \
            sd-cli --version | tee version.txt
          grep -q "$EXPECT_COMMIT" version.txt || fail "the installed sd-cli does not run"

          # A base upgrade while diverted must land beside, not over, the CUDA
          # copy. Reinstalling the same version takes that path.
          dpkg -i "dist/sd-cpp_${VERSION}_amd64.deb"
          cmp -s "$lib" "$LIBRARY" || fail "reinstalling sd-cpp overwrote the CUDA library"
          cmp -s "$lib.distrib" base-library.so || fail "reinstalling sd-cpp lost the base copy"

          dpkg -r sd-cpp-cuda
          [ -z "$(dpkg-divert --list "$lib")" ] || fail "the diversion outlived sd-cpp-cuda"
          [ ! -e "$lib.distrib" ] || fail "the diverted copy was left behind"
          cmp -s "$lib" base-library.so || fail "removal did not restore the base library"

          dpkg -r sd-cpp
          [ ! -e "$lib" ] || fail "the library outlived both packages"
          echo "install, reinstall, and removal all left the library where expected"

  publish:
    needs: [check, test, build, base, vulkan, cuda, cuda-test]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the three packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          # By name, so the build job's archive, which is internal to the run,
          # never lands beside the packages.
          pattern: '{base,vulkan,cuda}'
          path: artifacts
          merge-multiple: true

      - name: Check all three packages arrived
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # An artifact that silently failed to upload would otherwise produce
          # a release missing a package, and a dispatch naming a URL that 404s.
          missing=0
          for p in sd-cpp sd-cpp-vulkan sd-cpp-cuda; do
            f="artifacts/${p}_${VERSION}_amd64.deb"
            if [ -f "$f" ]; then
              printf '  %-28s %10d bytes\n' "$p" "$(stat -c %s "$f")"
            else
              echo "::error::missing $f"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately has no checkout, since it only needs the
          # artifacts, so gh has no git remote to infer the repository from and
          # fails with "not a git repository". GH_REPO supplies it directly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The tag mirrors upstream verbatim and is not semantic, matching
          # llama-cpp-deb, which released b10453 and b10333 before llama.cpp
          # went semantic. Title follows the sibling form.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" \
                 --title "stable-diffusion.cpp $TAG" \
                 --notes "Packaged as $VERSION for https://li-ruijie.github.io/apt/"
          # --clobber rather than deleting the release first. Deleting left a
          # window, roughly the length of the upload, in which a failure lost
          # both the old release and the new one, and took the tag with them.
          # That is recorded in whisper-cpp-deb.
          gh release upload "$TAG" artifacts/*.deb --clobber

      - name: Add the packages to the APT repository
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          BASE="https://github.com/li-ruijie/sd-cpp-deb/releases/download/$TAG"
          # The apt workflow fetches these anonymously, which is why this
          # repository has to stay public.
          jq -n --arg b "$BASE" --arg v "$VERSION" '{
            event_type: "add-debs",
            client_payload: {
              debs: [
                "\($b)/sd-cpp_\($v)_amd64.deb",
                "\($b)/sd-cpp-vulkan_\($v)_amd64.deb",
                "\($b)/sd-cpp-cuda_\($v)_amd64.deb"
              ]
            }
          }' | gh api repos/li-ruijie/apt/dispatches -X POST --input -
          echo "dispatched $VERSION to li-ruijie/apt"
